name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails when server/db/schema.ts changed without a committed migration.
      - name: Check migrations match the schema
        run: |
          bun run db:generate
          git status --porcelain server/db/migrations
          test -z "$(git status --porcelain server/db/migrations)"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck
