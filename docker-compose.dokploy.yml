# Dokploy deployment with external PostgreSQL, Redis, and SMTP services.
#
# In Dokploy:
#   1. Create a "Compose" service from this repository / file.
#   2. Set environment variables (Environment tab):
#        DATABASE_URL          postgresql://user:pass@host:5432/db?schema=public
#        REDIS_URL             redis[s]://cache-host:6379
#        QUEUE_REDIS_URL       redis[s]://queue-host:6379 (dedicated, noeviction)
#        BETTER_AUTH_SECRET    <random string, at least 32 chars>
#        BETTER_AUTH_URL       https://your-domain.tld  (the public origin)
#        SMTP_HOST / SMTP_PORT / SMTP_FROM  (SMTP delivery for reset emails)
#        NUXT_PUBLIC_ENABLE_REGISTRATION  "true"/"false" (optional, default true)
#        ADMIN_EMAIL / ADMIN_PASSWORD   (optional, used by the seed command)
#   3. Add a Domain pointing to this service on container port 3000.
#
# Database migrations run automatically on container start via the image
# entrypoint (`prisma migrate deploy`). No ports are published. Dokploy's
# Traefik reaches the app over the shared `dokploy-network`.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL for Nitro cache}
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:?set a dedicated BullMQ Redis URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NUXT_PUBLIC_ENABLE_REGISTRATION: ${NUXT_PUBLIC_ENABLE_REGISTRATION:-true}
      # Basic auth for the API docs endpoints; unset keeps them public.
      DOCS_BASIC_AUTH_USER: ${DOCS_BASIC_AUTH_USER:-}
      DOCS_BASIC_AUTH_PASSWORD: ${DOCS_BASIC_AUTH_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    networks:
      - dokploy-network
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    entrypoint: ["bun", "run", "worker"]
    environment:
      QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:?set a dedicated BullMQ Redis URL}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST for password reset email}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM for password reset email}
    networks:
      - dokploy-network
    restart: unless-stopped

networks:
  dokploy-network:
    external: true
