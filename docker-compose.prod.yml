# Production stack.
#
#   NUXT_SESSION_PASSWORD=$(openssl rand -base64 32) \
#     docker compose -f docker-compose.prod.yml up -d --build
#
# The `migrate` job applies migrations before the app starts. Seed the admin
# once it is up:
#   docker compose -f docker-compose.prod.yml run --rm migrate \
#     bun node_modules/prisma/build/index.js db seed
services:
  # One-off job: applies pending migrations, then exits. Built from the full
  # build stage so it has the Prisma CLI and its dependencies.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: ["bun", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nuxt_starter?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: nuxt_starter_app_prod
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/nuxt_starter?schema=public
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set a session secret of at least 32 chars}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: nuxt_starter_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nuxt_starter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
